body { margin: 0; background: #f4f1ea; font-family: Georgia, serif; color: #111; }

/* ── Masthead ── */
.masthead { text-align: center; padding: 20px 10px 0; }
.top-meta { display: flex; justify-content: space-between; font-size: 12px; text-transform: uppercase; }

.rules-line {
  font-size: 13px; text-transform: uppercase; margin: 8px 0; padding: 8px 0;

}

/* ── Entry screen ── */
.entry-wrap { max-width: 500px; margin: 32px auto; }
.entry-box  { border: 4px solid #000; background: #fff; padding: 28px 32px; text-align: center; }
.entry-box h2 { margin: 0 0 18px; font-size: 20px; text-transform: uppercase; letter-spacing: 1px; }
.entry-box input[type="text"] {
  width: 100%; padding: 8px 10px; font-family: Georgia, serif;

.btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 6px; }

/* ── Rooms list ── */
.rooms-section { margin-top: 28px; }
.rooms-section h3 {
  margin: 0 0 10px; font-size: 15px; text-transform: uppercase;

}
.room-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 10px; border-bottom: 1px dashed #aaa; font-size: 13px;
}
.room-row:hover { background: #f0ede5; }
.room-row .room-meta { color: #555; font-size: 12px; }
.no-rooms { font-size: 13px; color: #888; padding: 10px 0; }

/* ── Room-link notice ── */
.room-notice {
  margin-top: 10px; padding: 8px 12px; background: #f0f7f0;
  border: 1px solid #2e7d32; font-size: 13px; color: #2e7d32;
  font-weight: bold; text-align: center;
}

/* ── Game shell ── */
.game-shell { display: flex; gap: 24px; align-items: flex-start; }
.main-col   { flex: 1; min-width: 0; }
.side-col   { width: 250px; flex-shrink: 0; }

/* ── Game info bar ── */
.game-info {
  display: flex; justify-content: space-between; align-items: center;
  margin: 10px 0 14px; font-weight: bold; font-size: 14px;
  border-bottom: 2px solid #000; padding-bottom: 8px;
}
.room-pill {
  font-size: 11px; background: #8b0000; color: #fff;
  padding: 2px 8px; letter-spacing: 1px; text-transform: uppercase;
  margin-left: 8px; vertical-align: middle;
}
